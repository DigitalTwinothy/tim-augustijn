name: Live data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: false
jobs:
  haal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Repository ophalen
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${REPO}.git" site
      - name: Live data ophalen
        run: python3 site/.github/haal_live.py
      - name: Opslaan als er iets veranderde
        working-directory: site
        run: |
          git config user.name "live-data"
          git config user.email "DigitalTwinothy@users.noreply.github.com"
          git add stad/data/live.json
          git diff --cached --quiet || { git commit -q -m "Live data bijgewerkt"; git push -q; }
